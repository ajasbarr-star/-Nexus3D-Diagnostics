name: Deploy Nexus3D Diagnostics Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - name: Checkout diagnostics source
        uses: actions/checkout@v4
        with:
          ref: feature/nd-supabase-multidevice-phase1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "::error::Missing SUPABASE_PROJECT_ID secret"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "rupftghvjmalntjoesnv" || { echo "::error::Project ID does not match the approved Nexus3D-Diagnostics project"; exit 1; }

      - name: Deploy create-enrollment-code
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy create-enrollment-code --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Deploy register-device
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy register-device --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Deploy ingest-events
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ingest-events --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
