name: Deploy Nexus3D Diagnostics Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nd-supabase-multidevice-phase1
      - feature/automatic-device-release-beta-management
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-edge-functions.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - name: Checkout diagnostics source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Validate deployment configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          NEXUS3D_AUTO_ENROLL_WORKSPACE_ID: ${{ secrets.NEXUS3D_AUTO_ENROLL_WORKSPACE_ID }}
          NEXUS3D_OWNER_ADMIN_EMAIL: ${{ secrets.NEXUS3D_OWNER_ADMIN_EMAIL }}
          NEXUS3D_ADMIN_SETUP_CODE_SHA256: ${{ secrets.NEXUS3D_ADMIN_SETUP_CODE_SHA256 }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "::error::Missing SUPABASE_PROJECT_ID secret"; exit 1; }
          test -n "$NEXUS3D_AUTO_ENROLL_WORKSPACE_ID" || { echo "::error::Missing NEXUS3D_AUTO_ENROLL_WORKSPACE_ID environment secret"; exit 1; }
          test -n "$NEXUS3D_OWNER_ADMIN_EMAIL" || { echo "::error::Missing NEXUS3D_OWNER_ADMIN_EMAIL environment secret"; exit 1; }
          [[ "$NEXUS3D_OWNER_ADMIN_EMAIL" =~ ^[^@[:space:]]+@gmail\.com$ ]] || { echo "::error::Owner Admin email must be a Gmail address"; exit 1; }
          [[ "$NEXUS3D_ADMIN_SETUP_CODE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Admin Setup Code secret must be a SHA-256 hex digest"; exit 1; }
          [[ "$NEXUS3D_AUTO_ENROLL_WORKSPACE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Workspace ID is not a UUID"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "rupftghvjmalntjoesnv" || { echo "::error::Project ID does not match the approved Nexus3D-Diagnostics project"; exit 1; }

      - name: Configure automatic device registration workspace
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXUS3D_AUTO_ENROLL_WORKSPACE_ID: ${{ secrets.NEXUS3D_AUTO_ENROLL_WORKSPACE_ID }}
        run: |
          supabase secrets set "NEXUS3D_AUTO_ENROLL_WORKSPACE_ID=$NEXUS3D_AUTO_ENROLL_WORKSPACE_ID" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes


      - name: Configure Owner Admin bootstrap secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXUS3D_OWNER_ADMIN_EMAIL: ${{ secrets.NEXUS3D_OWNER_ADMIN_EMAIL }}
          NEXUS3D_ADMIN_SETUP_CODE_SHA256: ${{ secrets.NEXUS3D_ADMIN_SETUP_CODE_SHA256 }}
        run: |
          supabase secrets set "NEXUS3D_OWNER_ADMIN_EMAIL=$NEXUS3D_OWNER_ADMIN_EMAIL" "NEXUS3D_ADMIN_SETUP_CODE_SHA256=$NEXUS3D_ADMIN_SETUP_CODE_SHA256" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes

      - name: Link approved Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Apply additive Supabase schema migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Add SUPABASE_DB_PASSWORD as a GitHub Actions secret to apply the additive device metadata migration."; exit 1; }
          supabase db push --linked --yes

      - name: Deploy create-enrollment-code
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy create-enrollment-code --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes

      - name: Deploy owner-admin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy owner-admin --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes

      - name: Deploy register-device
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy register-device --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes

      - name: Deploy ingest-events
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ingest-events --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes

      - name: Deploy auto-register-device
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy auto-register-device --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes

      - name: Deploy report-installation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy report-installation --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes

      - name: Deploy device-presence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy device-presence --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes
