
name: Nexus3D Diagnostics Android APK

on:
  push:
    branches:
      - main
      - feature/nexus3d-editor-diagnostics-bridge
      - feature/nd-supabase-multidevice-phase1
      - feature/automatic-device-release-beta-management
      - repair/accurate-apk-connection-status
  pull_request:
    branches:
      - feature/automatic-device-release-beta-management
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: nexus3d-diagnostics-test-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Diagnostics Test APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/nexus3d-diagnostics.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository and build tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }

      - name: Restore private signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          echo "Signing keystore restored."

      - name: Allocate successful-build number
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          VERSION_NAME="$(printf '1.0.%02d' "$BUILD_NUMBER")"
          STEM="$(printf 'Nexus3D _Diagnostics_Build%s_v%s' "$BUILD_NUMBER" "$VERSION_NAME")"
          echo "number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "stem=$STEM" >> "$GITHUB_OUTPUT"
          echo "tag=diagnostics-build-$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Preparing $STEM"
      - name: Run Device Inventory presence formatter tests
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:testDebugUnitTest -PdiagnosticsBuildNumber="$BUILD_NUMBER"

      - name: Enable Android Emulator hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi

          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM is available to the runner; Android Emulator will use hardware acceleration."
          else
            echo "::warning::KVM is unavailable. Enabling the Android Emulator 37+ software-emulation opt-in."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      - name: Run Android 13 cold-start and Owner Admin panel smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        with:
          api-level: 33
          arch: x86_64
          emulator-boot-timeout: 900
          script: gradle :app:connectedDebugAndroidTest -PdiagnosticsBuildNumber="$BUILD_NUMBER"

      - name: Build signed Test APK
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.build_meta.outputs.number }}
        run: |
          set -euo pipefail
          gradle :app:assembleDebug -PdiagnosticsBuildNumber="$BUILD_NUMBER"

      - name: Verify APK, package ID, version and signature
        id: verify
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.build_meta.outputs.version_name }}
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "ERROR: APK file not found."; exit 1; }

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"

          test -n "$APKSIGNER" || { echo "ERROR: apksigner not found."; exit 1; }
          test -n "$APKANALYZER" || { echo "ERROR: apkanalyzer not found."; exit 1; }

          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

          PACKAGE_INFO="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_INFO="$("$APKANALYZER" manifest version-name "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"

          test "$PACKAGE_INFO" = "com.nexus3d.diagnostics.debug"
          test "$VERSION_INFO" = "$EXPECTED_VERSION"
          test "$VERSION_CODE" -ge 26

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "APK checks passed: $PACKAGE_INFO $VERSION_INFO ($VERSION_CODE)"

      - name: Package APK with requested filename
        id: package
        shell: bash
        env:
          STEM: ${{ steps.build_meta.outputs.stem }}
          APK_SOURCE: ${{ steps.verify.outputs.apk }}
        run: |
          set -euo pipefail

          mkdir -p dist

          APK_NAME="${STEM}.apk"
          ZIP_NAME="${STEM}.zip"

          cp "$APK_SOURCE" "dist/$APK_NAME"
          (cd dist && zip -q "$ZIP_NAME" "$APK_NAME")

          test -s "dist/$APK_NAME"
          test -s "dist/$ZIP_NAME"

          unzip -l "dist/$ZIP_NAME"
          unzip -t "dist/$ZIP_NAME"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload named ZIP and standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: |
            dist/${{ steps.package.outputs.zip_name }}
            dist/${{ steps.package.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit successful build tag
        if: success() && github.event_name != 'pull_request' && github.ref_name == 'feature/automatic-device-release-beta-management'
        shell: bash
        env:
          BUILD_TAG: ${{ steps.build_meta.outputs.tag }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/$BUILD_TAG" >/dev/null; then
            echo "Build tag already exists; retaining the existing successful-build number."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag -a "$BUILD_TAG" -m "Successful Nexus3D Diagnostics build $BUILD_TAG"
            git push origin "refs/tags/$BUILD_TAG"
          fi

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"
